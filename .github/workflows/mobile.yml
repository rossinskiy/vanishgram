name: mobile
# Builds the phone apps. Nothing is signed here: signing keys live on the maintainer's computer, never in CI.
# Run from the Actions tab (workflow_dispatch) or push a tag like v0.1.2.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install the NDK (strips the native library)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null; "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
      - run: npm ci
      - run: npm run build -w @vanishgram/web
      - run: npm run sync:android -w @vanishgram/mobile
      - name: Version
        run: echo "VG_VERSION_NAME=$(node -p "require('./apps/mobile/package.json').version")" >> "$GITHUB_ENV"
      - name: Build release bundle and APK
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon bundleRelease assembleRelease
        env:
          VG_VERSION_CODE: ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: vanishgram-android
          path: |
            apps/mobile/android/app/build/outputs/bundle/release/*.aab
            apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
  ios:
    # An unsigned .ipa for installing with AltStore, Sideloadly or similar tools, which sign it with the user's own Apple ID.
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # sha256 of libsignal-client-ios-build-v0.86.5.tar.gz from build-artifacts.signal.org (the prebuilt native library, pinned)
      LIBSIGNAL_FFI_PREBUILD_CHECKSUM: a3df979aa39b307ac4ef0f3fd59536daab5d6b3f8257c7aefe5f0470625f2582
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w @vanishgram/web
      - run: npm run sync:ios -w @vanishgram/mobile
      - name: Install pods
        working-directory: apps/mobile/ios/App
        run: pod install
      - name: Build without signing
        working-directory: apps/mobile/ios/App
        run: |
          VERSION=$(node -p "require('../../package.json').version")
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" archive
          rm -rf Payload && mkdir Payload
          cp -R build/App.xcarchive/Products/Applications/App.app Payload/
          zip -qry "Vanishgram-$VERSION-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: vanishgram-ios
          path: apps/mobile/ios/App/Vanishgram-*.ipa
          if-no-files-found: error
  android-test:
    # Runs the app in an emulator and drives the native libsignal engine from the page.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install the NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null; "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
      - run: npm ci
      - run: npm run build -w @vanishgram/web
      - run: npm run sync:android -w @vanishgram/mobile
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_6
          script: |
            cd apps/mobile/android && ./gradlew --no-daemon :app:connectedDebugAndroidTest
            cd apps/mobile/android && ./gradlew --no-daemon :app:installDebug
            adb shell am start -n win.karatel.vanishgram/.MainActivity
            sleep 20
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/screen-login.png"
      - uses: actions/upload-artifact@v4
        with:
          name: android-screenshot
          path: screen-login.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-report
          path: apps/mobile/android/app/build/reports/androidTests
  ios-test:
    # Runs the app in the iOS simulator and checks the native libsignal engine through the same JSON bridge the page uses.
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      LIBSIGNAL_FFI_PREBUILD_CHECKSUM: a3df979aa39b307ac4ef0f3fd59536daab5d6b3f8257c7aefe5f0470625f2582
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w @vanishgram/web
      - run: npm run sync:ios -w @vanishgram/mobile
      - name: Install pods
        working-directory: apps/mobile/ios/App
        run: pod install
      - name: Build for the simulator
        working-directory: apps/mobile/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" ARCHS=arm64 ONLY_ACTIVE_ARCH=NO build
      - name: Run the self-check
        working-directory: apps/mobile/ios/App
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -E "iPhone" | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          for attempt in 1 2 3; do
            xcrun simctl boot "$DEVICE" || true
            xcrun simctl bootstatus "$DEVICE" -b && break
            xcrun simctl shutdown "$DEVICE" || true
          done
          xcrun simctl install "$DEVICE" build/sim/Build/Products/Debug-iphonesimulator/App.app
          (xcrun simctl launch --console --terminate-running-process "$DEVICE" win.karatel.vanishgram -vg-selftest > selftest.log 2>&1 &)
          for i in $(seq 1 60); do grep -q "VGSELFTEST" selftest.log && break; sleep 2; done
          cat selftest.log
          grep -q "VGSELFTEST OK" selftest.log
